<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XEOLint — GEO & SEO Linter for Next.js</title>
    <meta name="description" content="A fast, deterministic GEO and SEO linter & autofixer for Next.js. Ensure your site is optimized for search engines and AI crawlers.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* ─── Hero ─── */
        .hero {
            max-width: 640px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid #e0e0e0;
            border-radius: 999px;
            padding: 0.35rem 1rem;
            margin-bottom: 2rem;
            color: #666;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1.25rem;
        }

        h1 span {
            color: #999;
        }

        .subtitle {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #555;
            margin-bottom: 2.5rem;
        }

        /* ─── Install block ─── */
        .install-block {
            background: #111;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            padding: 1rem 2rem;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            margin-bottom: 1rem;
        }

        .install-block:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .install-block .prompt {
            color: #666;
            user-select: none;
        }

        .install-block .cmd {
            color: #fff;
        }

        .install-block .copy-icon {
            color: #666;
            font-size: 0.85rem;
            transition: color 0.15s ease;
        }

        .install-block:hover .copy-icon {
            color: #fff;
        }

        .copied-toast {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            color: #999;
            height: 1.5rem;
            margin-bottom: 2rem;
            transition: opacity 0.2s ease;
        }

        /* ─── Links ─── */
        .links {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: center;
        }

        .links a {
            font-size: 0.95rem;
            font-weight: 500;
            color: #111;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s ease;
        }

        .links a:hover {
            border-bottom-color: #111;
        }

        .links a svg {
            width: 18px;
            height: 18px;
        }

        /* ─── Footer ─── */
        .footer {
            position: fixed;
            bottom: 2rem;
            font-size: 0.8rem;
            color: #bbb;
        }

        /* ─── Responsive ─── */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.2rem;
            }
            .subtitle {
                font-size: 1rem;
            }
            .install-block {
                font-size: 0.85rem;
                padding: 0.85rem 1.25rem;
            }
            .links {
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <main class="hero">
        <div class="badge">Open Source · v0.1.0</div>

        <h1>XEOLint</h1>

        <p class="subtitle">
            A fast, deterministic linter for <strong>GEO</strong> and <strong>SEO</strong> in Next.js.<br>
            21 checks to ensure your site is optimized for search engines <span style="color:#999">&</span> AI crawlers.
        </p>

        <div class="install-block" onclick="copyInstall()" title="Click to copy">
            <span class="prompt">$</span>
            <span class="cmd">pip install xeolint</span>
            <span class="copy-icon">⎘</span>
        </div>

        <div class="copied-toast" id="toast">&nbsp;</div>

        <nav class="links">
            <a href="https://github.com/AntoineLevyy/XEO_lint" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                GitHub
            </a>
            <a href="https://pypi.org/project/xeolint/" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.585 11.692h4.328s2.432.039 2.432-2.35V5.391S16.714 3 11.936 3C7.362 3 7.647 4.983 7.647 4.983l.006 2.055h4.363v.617H5.92S3 7.283 3 11.84s2.542 4.404 2.542 4.404h1.517v-2.119s-.083-2.542 2.502-2.542zm-.294-5.373a.858.858 0 110-1.716.858.858 0 010 1.716zM18.452 7.532h-1.517v2.119s.083 2.542-2.502 2.542h-4.328s-2.432-.04-2.432 2.35v3.951s-.369 2.391 4.409 2.391c4.573 0 4.288-1.983 4.288-1.983l-.006-2.055h-4.363v-.617h6.097s2.919.352 2.919-4.205-2.541-4.404-2.541-4.404zm-3.86 10.37a.858.858 0 110 1.716.858.858 0 010-1.716z"/></svg>
                PyPI
            </a>
        </nav>
    </main>

    <footer class="footer">Built to help your code be understood by machines.</footer>

    <script>
        function copyInstall() {
            navigator.clipboard.writeText('pip install xeolint');
            const toast = document.getElementById('toast');
            toast.textContent = 'Copied to clipboard';
            setTimeout(() => { toast.innerHTML = '&nbsp;'; }, 2000);
        }
    </script>
</body>
</html>
