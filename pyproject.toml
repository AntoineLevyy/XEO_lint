[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xeolint"
version = "0.1.0"
description = "A GEO and SEO linter and autofixer for Next.js applications"
readme = "README.md"
authors = [
    { name = "XEOLint Contributors" }
]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
xeolint = "xeolint_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["xeolint_core", "xeolint_cli"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
